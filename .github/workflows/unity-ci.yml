name: Unity CI

on:
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]

# NOTE: unity-test-runner@v4 activates via Unity account credentials — the
# UNITY_EMAIL, UNITY_PASSWORD, and UNITY_SERIAL secrets must be configured in
# the repository settings. For a personal license the serial starts with "F"
# (visible in Unity Hub under Manage Licenses). The legacy UNITY_LICENSE (.ulf
# contents) secret is NOT forwarded into the container by v4 and cannot
# activate on its own. See https://game.ci/docs/github/activation

jobs:
  validate:
    name: Validate package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json is valid JSON
        run: python3 -c "import json; json.load(open('package.json'))"

      - name: Validate required UPM fields
        run: |
          python3 -c "
          import json, sys
          pkg = json.load(open('package.json'))
          required = ['name', 'version', 'displayName', 'description', 'unity']
          missing = [f for f in required if f not in pkg]
          if missing:
              print(f'Missing required fields: {missing}', file=sys.stderr)
              sys.exit(1)
          if pkg['name'] != 'com.antonsynd.sharpy':
              print(f'Unexpected package name: {pkg[\"name\"]}', file=sys.stderr)
              sys.exit(1)
          print('package.json is valid')
          print(f'  name: {pkg[\"name\"]}')
          print(f'  version: {pkg[\"version\"]}')
          print(f'  unity: {pkg[\"unity\"]}')
          "

  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      # This package is a UPM package, not a full Unity project. To run tests
      # with the Unity Test Runner, we need to create a minimal Unity project
      # and link this package into its Packages directory.
      - name: Setup minimal Unity project
        run: |
          mkdir -p TestProject/Assets
          mkdir -p TestProject/ProjectSettings
          mkdir -p TestProject/Packages

          # Link the package into the project
          ln -s $GITHUB_WORKSPACE TestProject/Packages/com.antonsynd.sharpy

          # Create minimal ProjectVersion.txt
          cat > TestProject/ProjectSettings/ProjectVersion.txt << 'EOF'
          m_EditorVersion: 2022.3.22f1
          EOF

          # Create a manifest that references the local package
          cat > TestProject/Packages/manifest.json << 'MANIFEST'
          {
            "dependencies": {
              "com.antonsynd.sharpy": "file:com.antonsynd.sharpy"
            }
          }
          MANIFEST

      # NOTE: UNITY_EMAIL, UNITY_PASSWORD, and UNITY_SERIAL secrets must be
      # configured for this step to work (see header comment).
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: TestProject
          testMode: EditMode
          unityVersion: 2022.3.22f1
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results (EditMode)
          path: ${{ steps.tests.outputs.artifactsPath }}
